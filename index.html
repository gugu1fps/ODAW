<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Ajax vs Tradicional</title>
</head>
<body style="font-family: Arial; text-align: center; margin-top: 50px;">

    <h2>Contador sem AJAX (Tradicional)</h2>
    <p>Cliques: <span id="numSem">0</span></p>
    <button onclick="clicarSem()">Contar</button>

    <hr style="margin: 40px;">

    <h2>Contador com AJAX (Moderno)</h2>
    <p>Cliques: <span id="numCom">0</span></p>
    <button onclick="clicarCom()">Contar</button>

    <script>
        function clicarSem() {
            let valor = Number(localStorage.getItem('s') || 0) + 1;
            localStorage.setItem('s', valor);
    
            document.body.innerHTML = "";
            setTimeout(() => { 
                location.reload(); 
            }, 200);
        }

        function clicarCom() {
            let valor = Number(localStorage.getItem('c') || 0) + 1;
            localStorage.setItem('c', valor);

            document.getElementById('numCom').innerText = valor;
        }

        document.getElementById('numSem').innerText = localStorage.getItem('s') || 0;
        document.getElementById('numCom').innerText = localStorage.getItem('c') || 0;
    </script>

</body>
</html>
